apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: agent-box
  namespace: local
  labels:
    role: agent
spec: {}
---
apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: agent-tools
  namespace: local
spec:
  selector:
    matchLabels:
      role: agent

  image:                 # pinned, so "a Debian box" is something this file guarantees
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - ripgrep

  devtools:
    - name: nodejs                   # both agents below install through Node.js
    - name: claude-code              # YOUR AGENT — swap for `codex`; nothing else changes
    - name: passthrough-www-browser  # opt-in: capture browser opens from inside the VM
---
# Sign-in opens in YOUR browser: autoForward carries the VM's ports back so the
# OAuth callback can land, and urlForward lets the VM ask your host to open the page.
apiVersion: core.ringleader.dev/v1
kind: LocalBinding
metadata:
  name: agent-forward
  namespace: local
spec:
  enabled: true
  workstationSelector:
    matchName: agent-box
  autoForward:
    forwardAll: true
  urlForward:
    enabled: true
    open: true
