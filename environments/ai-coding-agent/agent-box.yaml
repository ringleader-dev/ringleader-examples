apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: agent-box
  namespace: local
  labels:
    role: agent
spec:
  provider: vz                   # hcs on Windows, qemu on Linux
  egress:
    enforcement: strict          # reach only these hosts
    destinations:
      - host: deb.debian.org       # Debian packages
        ports: [80, 443]
      - host: deb.nodesource.com   # Node.js
      - host: registry.npmjs.org   # Claude Code itself
      - host: api.anthropic.com    # Claude Code's model and account
      - host: platform.claude.com  # Claude Code's sign-in
  lifecycle:
    ttl: 7d                      # deleted, disk included, a week after it was created
---
apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: agent-tools
  namespace: local
spec:
  selector:
    matchLabels:
      role: agent

  image:                 # pinned, so "a Debian box" is something this file guarantees
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - ripgrep

  devtools:
    - name: nodejs                   # Claude Code installs through Node.js
    - name: claude-code              # the agent
    - name: passthrough-www-browser  # opt-in: capture browser opens from inside the VM
---
# Sign-in: the VM's links reach your machine, and its ports are forwarded
# so the sign-in page can reach Claude Code in the VM.
apiVersion: core.ringleader.dev/v1
kind: LocalBinding
metadata:
  name: agent-forward
  namespace: local
spec:
  enabled: true
  workstationSelector:
    matchName: agent-box
  autoForward:
    forwardAll: true
  urlForward:
    enabled: true                    # send the VM's links to your machine
