apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: hello-tools
  namespace: local
spec:
  selector:
    matchLabels:
      example: hello   # any workstation carrying the label, not one named machine

  packages:            # a bare name is a system package; an object can pin a version or use npm
    - git
    - ripgrep

  devtools:            # curated install recipes, run inside the VM
    - name: nodejs
