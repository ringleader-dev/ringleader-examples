apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: ide
  namespace: local
spec:
  selector:
    matchLabels:
      tier: dev
  priority: 100

  image:
    os: linux
    distribution: debian
    version: "13"

  identity:
    shell: /bin/bash

  packages:
    - git
    - name: curl
      updatePolicy: latest

  devtools:
    - name: nodejs       # prerequisite for the npm-installed CLIs
    - name: vscode-web   # code-server

  # `auth: none` is safe here only because the forward below is loopback-only.
  # Do not carry it into anything reachable from a network.
  toolconfigs:
    - id: vscode-web
      name: vscode-web
      config:
        port: 8080
        auth: none

  ports:
    - 8080

  securityUpdates: true

  defaultLocalBinding:   # forwarding is not implicit; this seeds a device-local binding once
    enabled: true
    autoForward:
      forwardAll: true
---
apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: ide-box
  namespace: local
  labels:
    tier: dev          # matches the `ide` config's selector
spec:
  # providerConfig is read from the Workstation spec ONLY — never merged from a
  # config layer — so VM sizing has to live here.
  providerConfig:
    memory: 6   # GiB
    cpus: 2
