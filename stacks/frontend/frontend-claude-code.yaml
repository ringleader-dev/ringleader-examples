# Front-end stack with Claude Code. Add starter-app.yaml for a ready-made React app.
apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: frontend-claude-code
  labels:
    stack: frontend          # starter-app.yaml attaches by this label
    agent: claude-code
spec:
  providerConfig:            # memory and disk in GiB
    cpus: 4
    memory: 6
    disk: 30

  image:
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - curl
    - jq
    - ripgrep
    - type: npm
      name: pnpm

  devtools:
    - name: nodejs
      version: "24"
    - name: gh
    - name: playwright               # headless Chromium for browser tests
    - name: claude-code              # the agent
    - name: passthrough-www-browser  # sends the sign-in link to your machine

  egress:                    # reach the internet, but not your home or office network
    enforcement: open
    deny:
      - privateNetworks: true

  lifecycle:
    ttl: 7d                  # deleted, disk included, a week after it was created

  defaultLocalBinding:       # forward the workstation's ports to your machine
    enabled: true
    autoForward:
      forwardAll: true
    urlForward:
      enabled: true          # send sign-in links to your machine
