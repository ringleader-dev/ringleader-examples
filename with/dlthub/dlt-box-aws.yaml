# The same dlt workstation, running in AWS instead of on your laptop.
#
# Apply it from this link, signed in to Ringleader, with a CloudIdentity for aws
# in your namespace. Nothing below names a namespace: the box lands in the one
# your login gave you, the same one a bare `rl get workstation` lists.
#
#   rl apply -f https://raw.githubusercontent.com/ringleader-dev/ringleader-examples/main/with/dlthub/dlt-box-aws.yaml
#
# Setting up the cloud side, once per organization: https://docs.ringleader.dev/cloud-onboarding/aws/
apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: dlt-box
  labels:
    role: data-pipeline
    # THE LABEL THAT PICKS YOUR CloudIdentity, which carries the region, subnet and security group.
    # `cloud: aws` is the label the onboarding guide sets up. If your administrator
    # chose another, the box stops with the Ready reason CloudIdentityNotMatched and
    # `rl workstation describe dlt-box` names the fix. The README has the steps.
    cloud: aws
spec:
  requirements: ["provider:aws"]   # chooses the provider; the label above chooses the credentials

  providerConfig:      # sizing lives HERE only. A WorkstationConfig cannot set it.
    aws:
      instanceType: m6i.large      # 2 vCPU, 8 GiB
      rootVolumeGiB: 50

  # A cloud VM bills while it runs, and what should power it down is nobody USING
  # it rather than a deadline. So the idle policy is the control here and `ttl` is
  # the backstop it always was. Ringleader evaluates both with no client running,
  # so they still fire if you close your laptop and forget.
  lifecycle:
    idle:
      timeout: 2h                # stop the box once it has been idle this long
      sshSessions: true          # an `rl shell` or `rl tmux` session means in use
      processes: ["claude"]      # ...and so does the agent, left running unattended
      # EVERY condition here must agree the box is idle before the clock starts, so
      # declaring another can only make the box harder to stop. Two gaps to know
      # about: a PTY-less session (VS Code Remote-SSH, `scp`, `ssh box <cmd>`) is not
      # an `sshSessions` hit, and neither is a DETACHED tmux; the process above covers
      # those whenever the agent is what is running, and a `ports` or `checkCommand`
      # condition covers you when it is not.
      # SWAPPED THE AGENT for `codex`? Change this name with it. The probe compares
      # the executable name exactly, so `claude` never matches a `codex` process. It
      # would just quietly stop holding the box up.
      # `stop` is the only action there is; nothing here can delete your box.
    # And a hard ceiling underneath it, measured from when the box was created and
    # moved by nothing, not a stop and not a start. It stops the box at 8h whether or
    # not somebody is using it, so raise it if you run longer sessions than that.
    ttl: 8h
    ttlAction: stop              # stop, not delete: the box is yours to start again

---
apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: dlt-tools
spec:
  selector:
    matchLabels:
      role: data-pipeline

  image:               # pinned: the packages below are Debian names and dlt cares about the Python
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - curl
    - python3
    - python3-venv     # dlt needs Python 3.10+ (Debian 13 ships 3.13); venv is a separate package here
    - python3-pip
    - sqlite3

  devtools:
    - name: nodejs                   # both agents install through Node.js
    - name: claude-code              # YOUR AGENT — swap for `codex`; nothing else changes
    - name: passthrough-www-browser  # so the agent's sign-in opens on YOUR machine

  environment:
    # Off by default here because an example is a template people copy, and a box that
    # quietly talks to a third party is not a good default to spread. Delete to opt back in.
    RUNTIME__DLTHUB_TELEMETRY: "false"

  files:
    # /etc/profile.d, not ~/.bashrc: Debian's stock .bashrc returns early when the shell
    # is not interactive, so the venv would be missing from `rl shell box -- …`.
    - path: /etc/profile.d/dlt-venv.sh
      mode: "0644"
      content: |
        # ringleader: put the dlt virtualenv first on PATH
        if [ -d "$HOME/.venvs/dlt/bin" ]; then
          PATH="$HOME/.venvs/dlt/bin:$PATH"
          export PATH VIRTUAL_ENV="$HOME/.venvs/dlt"
        fi

        # An env var is dlt's highest-priority config provider, so this wins over any
        # .dlt/ an agent writes for itself and holds wherever a command is run from.
        export DESTINATION__SQLALCHEMY__CREDENTIALS="sqlite:///$HOME/hackernews.db"

    - path: ~/pipeline.py
      mode: "0644"
      content: |
        """Load Hacker News top stories into a local SQLite database.

        A reference implementation, there to compare your agent's version against.
        It does run, with no credentials, in a couple of minutes:

            python pipeline.py
            sqlite3 hackernews.db "select title, score, by from stories limit 5;"
        """

        import dlt
        import requests

        API = "https://hacker-news.firebaseio.com/v0"
        STORY_LIMIT = 50


        @dlt.resource(name="stories", write_disposition="merge", primary_key="id")
        def top_stories():
            """Yield the current top stories, one dict per story.

            merge + primary_key means a second run refreshes rows instead of
            duplicating them, which matters because scores and comment counts move.
            """
            ids = requests.get(f"{API}/topstories.json", timeout=30).json()
            for story_id in ids[:STORY_LIMIT]:
                item = requests.get(f"{API}/item/{story_id}.json", timeout=30).json()
                if not item:
                    continue
                item.pop("kids", None)   # a long list of comment ids; it would become its own table
                yield item


        def main():
            pipeline = dlt.pipeline(
                pipeline_name="hackernews",
                # Named, not configured inline: where "sqlalchemy" points lives in
                # ~/.dlt/secrets.toml, which is also how `dlt pipeline … show` finds it.
                destination="sqlalchemy",
                # SQLite has no schemas, so each dataset gets its own .db file. "main"
                # keeps the queryable tables in hackernews.db rather than a mangled
                # sibling, and avoids the ATTACH-based locking dlt warns about.
                dataset_name="main",
            )

            info = pipeline.run(top_stories())
            print(info)


        if __name__ == "__main__":
            main()

  scripts:
    - name: install-dlt
      phase: user            # runs as the login user, in $HOME
      runPolicy: onChange
      failOnError: true
      timeoutSeconds: 600
      env:
        # Pinned on purpose: a pipeline whose dependencies drift is the problem this
        # example exists to solve. Bump deliberately.
        DLT_VERSION: "1.30.0"     # https://github.com/dlt-hub/dlt/releases
        VENV: ".venvs/dlt"
        MARIMO_VERSION: "0.23.16"
        PYARROW_VERSION: "25.0.1"
        IBIS_VERSION: "12.0.0"
        NUMPY_VERSION: "2.5.2"
      content: |
        set -euo pipefail
        cd "$HOME"

        # A venv, not a system-wide pip install: Debian marks its Python externally
        # managed, so pip outside a venv is refused (PEP 668).
        if [ ! -d "$VENV" ]; then
          python3 -m venv "$VENV"
        fi

        "$VENV/bin/pip" install --upgrade pip
        "$VENV/bin/pip" install "dlt[sqlalchemy,hub]==${DLT_VERSION}" requests

        # `dlt pipeline <name> show` needs BOTH halves and refuses with a different
        # message for each: the `hub` extra above enables the command, the three
        # packages below are what it actually runs on (about 340 MB).
        "$VENV/bin/pip" install \
          "marimo==${MARIMO_VERSION}" \
          "pyarrow==${PYARROW_VERSION}" \
          "ibis-framework==${IBIS_VERSION}" \
          "numpy==${NUMPY_VERSION}"

        # secrets.toml, not config.toml: dlt refuses to read a credential from
        # config.toml. Absolute path, because the dashboard may run from elsewhere.
        mkdir -p "$HOME/.dlt"
        cat > "$HOME/.dlt/secrets.toml" <<TOML
        [destination.sqlalchemy]
        credentials = "sqlite:///$HOME/hackernews.db"
        TOML
        chmod 600 "$HOME/.dlt/secrets.toml"

        "$VENV/bin/dlt" --version
---
# Sign-in opens in YOUR browser: autoForward carries the VM's ports back so the
# OAuth callback can land, and urlForward lets the VM ask your host to open the page.
apiVersion: core.ringleader.dev/v1
kind: LocalBinding
metadata:
  name: dlt-forward
spec:
  enabled: true
  workstationSelector:
    matchName: dlt-box
  autoForward:
    forwardAll: true
  urlForward:
    enabled: true
    open: true
