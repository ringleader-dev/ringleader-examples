# The same dlt workstation, running in Google Cloud instead of on your laptop.
#
# Identical to dlt-box.yaml except for WHERE the machine runs. The tools, the
# pipeline, the agent and the dashboard are unchanged, which is the point: the
# provider is a placement decision, not a rewrite.
#
# BEFORE THIS WILL WORK you need two things that dlt-box.yaml does not:
#
#   1. A namespace that is not `local`. The reserved `local` namespace only ever
#      runs on your own machine, so a cloud box cannot live there. Replace
#      `your-namespace` below in ALL THREE documents.
#
#   2. A CloudIdentity for gcp in that namespace, and the LABEL it selects on,
#      set on the workstation below. It is admin-managed and it is what lets the
#      control plane create VMs in your project. If you have not onboarded a
#      cloud yet, start here:
#      https://docs.ringleader.dev/cloud-onboarding/gcp/
#
# Verified end to end on 2026-08-17 against a real GCP project: Debian 13 boots,
# dlt and the agent install, the pipeline loads 25 rows twice, and the dashboard
# forwards from the VM back to a laptop over the internet.
#
# Azure is the same file with `provider:azure` and an `azure:` providerConfig
# block. AWS likewise.
#
# Both of those are edits, so unlike the rest of the repository this one is
# downloaded rather than applied from a link:
#
#   curl -O https://raw.githubusercontent.com/ringleader-dev/ringleader-examples/main/with/dlthub/dlt-box-gcp.yaml
#   rl apply -f dlt-box-gcp.yaml
#   rl workstation wait dlt-box --for condition=Configured --timeout 20m -n your-namespace
#   rl shell dlt-box -n your-namespace
#
# Clean up (a cloud VM bills until you do):
#
#   rl workstation delete -f dlt-box-gcp.yaml -y
apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: dlt-box
  namespace: your-namespace
  labels:
    role: data-pipeline

    # THE LABEL THAT PICKS YOUR CloudIdentity, and the one thing here you cannot
    # copy from us. A CloudIdentity holds the project and zone the VM is created
    # in, and it finds workstations by label. If none matches, provisioning fails
    # with `providerConfig.gcp requires both project and zone`, which describes
    # the symptom rather than the cause: nothing supplied them because nothing
    # matched.
    #
    # `cloud: gcp` is what ours selects on. Yours may differ. Check with:
    #
    #   rl get cloudidentity -n <your-namespace> -o yaml
    #
    # and copy whatever is under its spec.selector.matchLabels.
    cloud: gcp
spec:
  # WHERE it runs. `requirements` is matched against the providers the control
  # plane can actually reach; `provider: gcp` is shorthand for the same thing.
  # On its own this is NOT enough: it chooses the provider, the label above
  # chooses the credentials and the project.
  requirements: ["provider:gcp"]

  # Sizing lives HERE and only here. A WorkstationConfig cannot set it, and
  # Ringleader refuses the manifest if you try, because a shared config setting
  # everyone's VM size is not something you want to happen by accident.
  providerConfig:
    gcp:
      machineType: n2-standard-2
      diskGiB: 50

  # A cloud VM bills until it is deleted, and a laptop VM does not. Ringleader
  # enforces this itself, with no client running, so the box goes away even if
  # you close your laptop and forget. Remove it if you want the box to persist.
  ttl: 8h
  ttlAction: delete
---
apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: dlt-tools
  namespace: your-namespace
spec:
  selector:
    matchLabels:
      role: data-pipeline

  # Pinned explicitly. The packages below are Debian package names and the
  # Python version matters to dlt, so leaving the image to the provider default
  # would make this example depend on which provider you happen to be on.
  image:
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - curl
    # dlt needs Python 3.10+; Debian 13 ships 3.13. venv is a separate package
    # on Debian and is the usual first thing to trip over.
    - python3
    - python3-venv
    - python3-pip
    # so you can actually look at what the pipeline wrote
    - sqlite3

  devtools:
    - name: nodejs                   # both agents below install through Node.js

    # YOUR AGENT. This is the only agent-specific line in the file: swap it for
    # `codex` and everything else here still applies. Anything else shipping an
    # npm CLI can go in `packages` as `{type: npm, name: ...}` instead.
    - name: claude-code

    # So the agent's sign-in opens on YOUR machine instead of printing a URL the
    # VM cannot open. Needed by whichever agent you chose.
    - name: passthrough-www-browser

  environment:
    # dlt sends anonymous usage telemetry by default, to
    # https://telemetry.scalevector.ai. It is genuinely anonymous (a random id
    # in ~/.dlt/.anonymous_id, no account, no email) and it helps the project.
    #
    # It is off here anyway, because an example is a template people copy, and
    # a box that quietly talks to a third party is not a good default to spread.
    # Declaring it in the manifest rather than letting the box write itself a
    # config file is the point: outbound traffic is something a reviewer can see
    # in the diff. Delete these two lines to opt back in.
    RUNTIME__DLTHUB_TELEMETRY: "false"

  files:
    # Put the venv on PATH for login shells. /etc/profile.d is read by the login
    # shell `rl shell` opens; appending to ~/.bashrc instead would only work for
    # interactive shells, because Debian's stock .bashrc returns early when the
    # shell is not interactive.
    - path: /etc/profile.d/dlt-venv.sh
      mode: "0644"
      content: |
        # ringleader: put the dlt virtualenv first on PATH
        if [ -d "$HOME/.venvs/dlt/bin" ]; then
          PATH="$HOME/.venvs/dlt/bin:$PATH"
          export PATH VIRTUAL_ENV="$HOME/.venvs/dlt"
        fi

    - path: ~/pipeline.py
      mode: "0644"
      content: |
        """Load Hacker News top stories into a local SQLite database.

        A reference implementation. The point of this example is to have your
        agent write one of these, so treat this as something to compare against
        rather than the thing to run, though it does run, with no credentials
        and in about a minute.

            python pipeline.py
            sqlite3 hackernews.db "select title, score, by from stories limit 5;"
        """

        import dlt
        import requests

        API = "https://hacker-news.firebaseio.com/v0"
        STORY_LIMIT = 25


        @dlt.resource(name="stories", write_disposition="merge", primary_key="id")
        def top_stories():
            """Yield the current top stories, one dict per story.

            write_disposition="merge" with primary_key="id" means re-running
            updates existing rows instead of duplicating them. Scores and
            comment counts move, so a second run refreshes rather than appends.
            """
            ids = requests.get(f"{API}/topstories.json", timeout=30).json()
            for story_id in ids[:STORY_LIMIT]:
                item = requests.get(f"{API}/item/{story_id}.json", timeout=30).json()
                if not item:
                    continue
                # `kids` is a long list of comment ids that would become its own
                # child table. Drop it: this example is about the stories.
                item.pop("kids", None)
                yield item


        def main():
            pipeline = dlt.pipeline(
                pipeline_name="hackernews",
                # Named, not configured inline. Where "sqlalchemy" actually
                # points lives in ~/.dlt/secrets.toml, which the workstation
                # wrote. The code says what kind of destination it wants and
                # the environment says which one, so the same pipeline runs
                # against SQLite here and BigQuery somewhere else without
                # editing this file. It is also what lets
                # `dlt pipeline hackernews show` read your data, since the
                # dashboard resolves the destination the same way.
                destination="sqlalchemy",
                # SQLite has no schemas, so dlt gives each dataset its own .db
                # file. "main" puts the queryable tables in hackernews.db
                # itself rather than a name-mangled sibling, and avoids the
                # ATTACH-based locking dlt warns about for other names. The
                # merge staging dataset still gets its own file alongside.
                dataset_name="main",
            )

            info = pipeline.run(top_stories())
            print(info)


        if __name__ == "__main__":
            main()

  scripts:
    # A dedicated virtualenv rather than a system-wide pip install. Debian marks
    # its Python as externally managed, so `pip install` outside a venv is
    # refused (PEP 668), and a venv is what dlthub recommends anyway.
    #
    # VERSIONS ARE PINNED ON PURPOSE. A data pipeline whose dependencies drift is
    # the problem this example exists to solve, so bump these deliberately.
    - name: install-dlt
      phase: user            # runs as the login user, in $HOME
      runPolicy: onChange
      failOnError: true
      timeoutSeconds: 600
      env:
        DLT_VERSION: "1.30.0"     # https://github.com/dlt-hub/dlt/releases
        VENV: ".venvs/dlt"
        # What `dlt pipeline <name> show` runs on, installed up front so looking
        # at your data is one command rather than a detour. About 340 MB.
        MARIMO_VERSION: "0.23.16"
        PYARROW_VERSION: "25.0.1"
        IBIS_VERSION: "12.0.0"
      content: |
        set -euo pipefail
        cd "$HOME"

        if [ ! -d "$VENV" ]; then
          python3 -m venv "$VENV"
        fi

        # sqlalchemy is dlt's SQLite destination, so the examples write to a
        # local .db file with nothing external to configure. Swap the extra for
        # the destination you actually want: dlt[bigquery], dlt[snowflake],
        # dlt[postgres], and so on. `requests` is what the sources use to call
        # the APIs.
        "$VENV/bin/pip" install --upgrade pip
        "$VENV/bin/pip" install "dlt[sqlalchemy,hub]==${DLT_VERSION}" requests

        # `dlt pipeline <name> show` needs BOTH halves and refuses with a
        # different message for each, which is easy to fix one at a time and
        # think you are done. The `hub` extra above enables the command; the
        # three packages below are what it actually runs on.
        "$VENV/bin/pip" install \
          "marimo==${MARIMO_VERSION}" \
          "pyarrow==${PYARROW_VERSION}" \
          "ibis-framework==${IBIS_VERSION}"

        # Declare the destination in dlt's own config, not in the pipeline code.
        #
        # This is what makes `dlt pipeline <name> show` able to read your data.
        # The dashboard is a separate process: it re-resolves the destination
        # from dlt's configuration providers, and finds nothing if the
        # credentials only ever existed as an argument inside pipeline.py. You
        # get a dashboard that renders the trace and the schema but reports
        # "Could not connect to destination. Configuration values are missing."
        #
        # It has to be secrets.toml rather than config.toml: dlt refuses to read
        # a credential from config.toml and says so.
        #
        # An absolute path, because the dashboard does not necessarily run from
        # the same working directory the pipeline did.
        mkdir -p "$HOME/.dlt"
        cat > "$HOME/.dlt/secrets.toml" <<TOML
        [destination.sqlalchemy]
        credentials = "sqlite:///$HOME/hackernews.db"
        TOML
        chmod 600 "$HOME/.dlt/secrets.toml"

        "$VENV/bin/dlt" --version
---
# Sign-in happens in YOUR browser, even though the agent runs in the VM.
#
# autoForward carries the VM's listening ports back to this device so the OAuth
# callback can land, and urlForward lets the VM ask your host to open the page.
# Agent-agnostic: whichever agent you put in the config above needs both halves.
apiVersion: core.ringleader.dev/v1
kind: LocalBinding
metadata:
  name: dlt-forward
  namespace: your-namespace
spec:
  enabled: true
  workstationSelector:
    matchName: dlt-box
  autoForward:
    forwardAll: true
  urlForward:
    enabled: true
    open: true
