# The same ToolHive workstation, running in Google Cloud instead of on your laptop.
#
# BEFORE THIS WILL WORK, replace `your-namespace` in ALL THREE documents below and
# set the label your own CloudIdentity selects on (see the comment on it). The
# README explains both, and https://docs.ringleader.dev/cloud-onboarding/gcp/ has
# the onboarding. Because those are edits, download this one rather than applying
# it from a link:
#
#   curl -O https://raw.githubusercontent.com/ringleader-dev/ringleader-examples/main/with/stacklok-toolhive/toolhive-box-gcp.yaml
apiVersion: workstations.ringleader.dev/v1
kind: Workstation
metadata:
  name: toolhive-box
  namespace: your-namespace
  labels:
    role: mcp-host
    # THE LABEL THAT PICKS YOUR CloudIdentity — the one thing here you cannot copy
    # from us. Find yours with `rl get cloudidentity -n <your-namespace> -o yaml`
    # and use its spec.selector.matchLabels. If nothing matches, provisioning fails
    # with `providerConfig.gcp requires both project and zone`.
    cloud: gcp
spec:
  requirements: ["provider:gcp"]   # chooses the provider; the label above chooses the credentials

  providerConfig:      # sizing lives HERE only — a WorkstationConfig cannot set it
    gcp:
      machineType: n2-standard-4
      diskGiB: 60

  # A cloud VM bills while it runs, and what should power it down is nobody USING
  # it rather than a deadline. So the idle policy is the control here and `ttl` is
  # the backstop it always was. Ringleader evaluates both with no client running,
  # so they still fire if you close your laptop and forget.
  lifecycle:
    idle:
      timeout: 2h                # stop the box once it has been idle this long
      sshSessions: true          # an `rl shell` or `rl tmux` session means in use
      processes: ["claude"]      # ...and so does the agent, left running unattended
      # EVERY condition here must agree the box is idle before the clock starts, so
      # declaring another can only make the box harder to stop. Two gaps to know
      # about: a PTY-less session (VS Code Remote-SSH, `scp`, `ssh box <cmd>`) is not
      # an `sshSessions` hit, and neither is a DETACHED tmux; the process above covers
      # those whenever the agent is what is running, and a `ports` or `checkCommand`
      # condition covers you when it is not.
      # SWAPPED THE AGENT for `codex`? Change this name with it. The probe compares
      # the executable name exactly, so `claude` never matches a `codex` process — it
      # would just quietly stop holding the box up.
      # `stop` is the only action there is; nothing here can delete your box.
    # And a hard ceiling underneath it, measured from when the box was created and
    # moved by nothing — not a stop, not a start. It stops the box at 8h whether or
    # not somebody is using it, so raise it if you run longer sessions than that.
    ttl: 8h
    ttlAction: stop              # stop, not delete: the box is yours to start again

---
apiVersion: workstations.ringleader.dev/v1
kind: WorkstationConfig
metadata:
  name: toolhive
  namespace: your-namespace
spec:
  selector:
    matchLabels:
      role: mcp-host

  image:               # pinned: the install script below needs `dpkg --print-architecture`
    os: linux
    distribution: debian
    version: "13"

  packages:
    - git
    - curl
    - ca-certificates

  devtools:
    - name: docker                   # the container runtime ToolHive requires
    - name: nodejs                   # the agent below installs through Node.js
    - name: claude-code              # YOUR AGENT — swap for `codex`; ToolHive registers either
    - name: passthrough-www-browser  # opt-in: lets the agent's sign-in open on your machine

  scripts:
    - name: install-toolhive
      phase: system
      runPolicy: onChange
      failOnError: true
      timeoutSeconds: 300
      env:
        # Pinned on purpose — a reproducible environment is the point. Bump it deliberately.
        # Releases: https://github.com/stacklok/toolhive/releases
        THV_VERSION: "0.44.0"
      content: |
        set -euo pipefail

        # Skip if this exact version is already installed, so re-applying is cheap.
        if command -v thv >/dev/null 2>&1 && thv version 2>/dev/null | grep -q "${THV_VERSION}"; then
          echo "thv ${THV_VERSION} already installed"
          exit 0
        fi

        arch="$(dpkg --print-architecture)"   # amd64 | arm64
        tarball="toolhive_${THV_VERSION}_linux_${arch}.tar.gz"
        base="https://github.com/stacklok/toolhive/releases/download/v${THV_VERSION}"

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        cd "$tmp"

        curl -fsSL -O "${base}/${tarball}"
        tar -xzf "${tarball}" thv
        install -m 0755 thv /usr/local/bin/thv

        thv version
---
# Sign-in opens in YOUR browser: autoForward carries the VM's ports back so the
# OAuth callback can land, and urlForward lets the VM ask your host to open the page.
apiVersion: core.ringleader.dev/v1
kind: LocalBinding
metadata:
  name: toolhive-forward
  namespace: your-namespace
spec:
  enabled: true
  workstationSelector:
    matchName: toolhive-box
  autoForward:
    forwardAll: true
  urlForward:
    enabled: true
    open: true
